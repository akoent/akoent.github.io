<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Amortization Schedule</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 30px auto;
        padding: 20px;
        background: #f4f6f8;
    }

    h1 {
        text-align: center;
        color: #333;
    }

    .form-container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }

    .form-row {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }

    .form-group {
        flex: 1;
        min-width: 200px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        margin-top: 20px;
        padding: 12px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }

    .payment-summary {
        margin: 20px 0;
        font-size: 18px;
        font-weight: bold;
        color: #006400;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    th {
        background: #007bff;
        color: white;
        padding: 12px;
        position: sticky;
        top: 0;
    }

    td {
        padding: 10px;
        text-align: right;
        border-bottom: 1px solid #ddd;
    }

    td:first-child,
    th:first-child {
        text-align: center;
    }

    tr:nth-child(even) {
        background: #f9f9f9;
    }
</style>
</head>
<body>

<h1>Loan Amortization Schedule</h1>

<div class="form-container">
    <div class="form-row">
        <div class="form-group">
            <label>Loan Amount ($)</label>
            <input type="number" id="loanAmount" value="250000">
        </div>

        <div class="form-group">
            <label>Annual Interest Rate (%)</label>
            <input type="number" id="interestRate" value="6.5" step="0.01">
        </div>

        <div class="form-group">
            <label>Loan Term (Years)</label>
            <input type="number" id="loanTerm" value="30">
        </div>
    </div>

    <button onclick="generateSchedule()">Generate Schedule</button>

    <div id="paymentSummary" class="payment-summary"></div>
</div>

<table id="scheduleTable">
    <thead>
        <tr>
            <th>Month</th>
            <th>Payment</th>
            <th>Interest Paid</th>
            <th>Principal Portion</th>
            <th>Balance</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
function generateSchedule() {

    const principal = parseFloat(document.getElementById("loanAmount").value);
    const annualRate = parseFloat(document.getElementById("interestRate").value);
    const years = parseInt(document.getElementById("loanTerm").value);

    const monthlyRate = annualRate / 100 / 12;
    const totalPayments = years * 12;

    let monthlyPayment;

    if (monthlyRate === 0) {
        monthlyPayment = principal / totalPayments;
    } else {
        monthlyPayment =
            principal *
            (monthlyRate * Math.pow(1 + monthlyRate, totalPayments)) /
            (Math.pow(1 + monthlyRate, totalPayments) - 1);
    }

    document.getElementById("paymentSummary").innerHTML =
        `Monthly Payment: $${monthlyPayment.toFixed(2)}`;

    const tbody = document.querySelector("#scheduleTable tbody");
    tbody.innerHTML = "";

    let balance = principal;

    for (let month = 1; month <= totalPayments; month++) {

        const interestPaid = balance * monthlyRate;
        let principalPaid = monthlyPayment - interestPaid;

        if (balance < principalPaid) {
            principalPaid = balance;
        }

        balance -= principalPaid;

        if (balance < 0.01) {
            balance = 0;
        }

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${month}</td>
            <td>$${monthlyPayment.toFixed(2)}</td>
            <td>$${interestPaid.toFixed(2)}</td>
            <td>$${principalPaid.toFixed(2)}</td>
            <td>$${balance.toFixed(2)}</td>
        `;

        tbody.appendChild(row);

        if (balance === 0) {
            break;
        }
    }
}

// Generate initial schedule on page load
generateSchedule();
</script>

</body>
</html>
